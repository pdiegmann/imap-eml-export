## Dovecot minimal configuration for local IMAP testing
## Single self-contained file — no conf.d includes

# Enable only IMAP
protocols = imap

# Authentication: allow plain-text login (safe for local/Docker testing)
auth_mechanisms = plain login
disable_plaintext_auth = no

passdb {
  driver = passwd-file
  args = /etc/dovecot/users
}

userdb {
  driver = static
  args = uid=vmail gid=vmail home=/var/mail/%u
}

# Mail storage in Maildir format
mail_location = maildir:/var/mail/%u/Maildir

# Namespace: expose folders with / as hierarchy separator
# e.g. "Work/ProjectA" maps to .Work.ProjectA on disk
namespace inbox {
  inbox = yes
  separator = /
  prefix =
}

# IMAP service: plain on 143, TLS on 993
service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

# SSL — self-signed cert is generated by entrypoint.sh at startup
ssl = yes
ssl_cert = </etc/dovecot/ssl/dovecot.pem
ssl_key = </etc/dovecot/ssl/dovecot.key

# Log to stderr/stdout so Docker captures output
log_path = /dev/stderr
info_log_path = /dev/stdout