# Test configuration for the local Docker IMAP server.
# Start the server first:  docker compose up -d
# Then run the exporter:   ./imap-eml-export export --config config.test.toml -y
#
# The server is pre-loaded with sample emails in:
#   INBOX          (3 messages)
#   Sent           (2 messages)
#   Work           (1 message)
#   Work/ProjectA  (1 message)
#
# Compare the exported .eml files in test-output/ against dev/imap/sample-emails/.

[export]
host       = "localhost"
port       = 143
username   = "testuser"
password   = "testpassword"
output_dir = "./test-output"
tls        = false
starttls   = false

[import]
host      = "localhost"
port      = 143
username  = "testuser"
password  = "testpassword"
input_dir = "./test-output"
tls       = false
starttls  = false
